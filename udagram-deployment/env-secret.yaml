# Confidential values (NOT AWS creds — see aws-secret.yaml for those).
# These are plain strings per the project instructions (not base64), but
# Kubernetes "stringData" handles the encoding for you on apply.
apiVersion: v1
kind: Secret
metadata:
  name: env-secret
type: Opaque
stringData:
  POSTGRES_USERNAME: "postgres"
  POSTGRES_PASSWORD: "REPLACE_ME"
  JWT_SECRET: "REPLACE_ME"
