# AWS credentials file, base64-encoded, mounted into backend-feed for the
# S3 presigned-URL feature (uses the AWS SDK "fromIni" / shared-credentials
# provider, i.e. a ~/.aws/credentials-style file).
#
# Replace the value below with:
#   cat ~/.aws/credentials | base64
apiVersion: v1
kind: Secret
metadata:
  name: aws-secret
type: Opaque
data:
  credentials: ___INSERT_AWS_CREDENTIALS_FILE__BASE64____
