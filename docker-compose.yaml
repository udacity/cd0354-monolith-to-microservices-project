version: "3.8"
services:
  backend-user:
    image: alisaber21/udagram-api-user:v1
    environment:
      POSTGRES_USERNAME: $POSTGRES_USERNAME
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_HOST: $POSTGRES_HOST
      POSTGRES_DB: $POSTGRES_DB
      AWS_BUCKET: $AWS_BUCKET
      AWS_REGION: $AWS_REGION
      AWS_PROFILE: $AWS_PROFILE
      JWT_SECRET: $JWT_SECRET
      URL: $URL
    ports:
      - "8081:8080"

  backend-feed:
    image: alisaber21/udagram-api-feed:v1
    environment:
      POSTGRES_USERNAME: $POSTGRES_USERNAME
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_HOST: $POSTGRES_HOST
      POSTGRES_DB: $POSTGRES_DB
      AWS_BUCKET: $AWS_BUCKET
      AWS_REGION: $AWS_REGION
      AWS_PROFILE: $AWS_PROFILE
      JWT_SECRET: $JWT_SECRET
      URL: $URL
    ports:
      - "8082:8080"
    volumes:
      - ~/.aws:/root/.aws:ro

  reverseproxy:
    image: alisaber21/reverseproxy:v1
    ports:
      - "8080:8080"
    depends_on:
      - backend-user
      - backend-feed

  frontend:
    image: alisaber21/udagram-frontend:v1
    ports:
      - "8100:80"
    depends_on:
      - reverseproxy
