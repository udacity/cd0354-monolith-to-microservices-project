name: Build and Push Docker Images

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

env:
  IMAGE_TAG: v1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build images
        run: |
          docker build -t udagram-api-feed ./udagram-api-feed
          docker build -t udagram-api-user ./udagram-api-user
          docker build -t udagram-frontend ./udagram-frontend
          docker build -t reverseproxy ./udagram-reverseproxy

      - name: Tag images
        run: |
          docker tag udagram-api-feed "${{ secrets.DOCKER_USERNAME }}/udagram-api-feed:$IMAGE_TAG"
          docker tag udagram-api-user "${{ secrets.DOCKER_USERNAME }}/udagram-api-user:$IMAGE_TAG"
          docker tag udagram-frontend "${{ secrets.DOCKER_USERNAME }}/udagram-frontend:$IMAGE_TAG"
          docker tag reverseproxy "${{ secrets.DOCKER_USERNAME }}/reverseproxy:$IMAGE_TAG"

      - name: Push images to Docker Hub
        run: |
          docker push "${{ secrets.DOCKER_USERNAME }}/udagram-api-feed:$IMAGE_TAG"
          docker push "${{ secrets.DOCKER_USERNAME }}/udagram-api-user:$IMAGE_TAG"
          docker push "${{ secrets.DOCKER_USERNAME }}/udagram-frontend:$IMAGE_TAG"
          docker push "${{ secrets.DOCKER_USERNAME }}/reverseproxy:$IMAGE_TAG"
