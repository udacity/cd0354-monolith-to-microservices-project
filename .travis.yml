language: minimal
services:
  - docker

env:
  global:
    # short image tag (first 7 chars of commit)
    - IMAGE_TAG=${TRAVIS_COMMIT::7}

before_install:
  - docker info

script:
  # Build each service image
  - docker build -t reverseproxy ./udagram-reverseproxy
  - docker build -t udagram-api-user ./udagram-api-user
  - docker build -t udagram-api-feed ./udagram-api-feed
  - docker build -t udagram-frontend ./udagram-frontend

after_success:
  # Login to DockerHub (set DOCKER_USERNAME and DOCKER_PASSWORD in Travis repo settings)
  - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

  # Tag and push images to your DockerHub account
  - docker tag reverseproxy $DOCKER_USERNAME/reverseproxy:$IMAGE_TAG
  - docker tag udagram-api-user $DOCKER_USERNAME/udagram-api-user:$IMAGE_TAG
  - docker tag udagram-api-feed $DOCKER_USERNAME/udagram-api-feed:$IMAGE_TAG
  - docker tag udagram-frontend $DOCKER_USERNAME/udagram-frontend:$IMAGE_TAG

  - docker push $DOCKER_USERNAME/reverseproxy:$IMAGE_TAG
  - docker push $DOCKER_USERNAME/udagram-api-user:$IMAGE_TAG
  - docker push $DOCKER_USERNAME/udagram-api-feed:$IMAGE_TAG
  - docker push $DOCKER_USERNAME/udagram-frontend:$IMAGE_TAG

# Optional: keep build logs concise
notifications:
  email: false
language: node_js
node_js:
  - 13

services:
  - docker

# Pre-testing installs
install:
  - echo "nothing needs to be installed"

# Scripts to be run such as tests
before_script:
  - echo "no tests"

script:
  - docker --version # print the version for logging
  - docker build -t simple-node .
  - docker tag simple-node ddiazz0/simple-node:latest

# Tasks to perform after the process is successful. Formatting the Docker username and password as below enables you to programmatically log in without having the password exposed in logs.
after_success:
  - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
  - docker push ddiazz0/simple-node