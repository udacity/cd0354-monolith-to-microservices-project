language: node_js
node_js:
  - 18

branches:
  only:
    - main

services:
  - docker

# Pre-testing installs
install:
  - echo "nothing needs to be installed"

# Scripts to be run such as tests
before_script:
  - echo "no tests"

script:
  - docker --version # print the version for logging
  - docker build -t udagram-api-feed ./udagram-api-feed
  - docker build -t udagram-api-user ./udagram-api-user
  - docker build -t udagram-frontend ./udagram-frontend
  - docker build -t reverseproxy ./udagram-reverseproxy

  - docker tag udagram-api-feed halalalala/udagram-api-feed:v1
  - docker tag udagram-api-user halalalala/udagram-api-user:v1
  - docker tag udagram-frontend halalalala/udagram-frontend:v1
  - docker tag reverseproxy halalalala/reverseproxy:v1

after_success:
  - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
  - docker push halalalala/udagram-api-feed:v1
  - docker push halalalala/udagram-api-user:v1
  - docker push halalalala/udagram-frontend:v1
  - docker push halalalala/reverseproxy:v1